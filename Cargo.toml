[workspace]
resolver = "2"
members = [
    "crates/bomber-proto",
    "crates/bomber-sim",
    "crates/bomber-server",
    "crates/bomber-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bomber-proto = { path = "crates/bomber-proto" }
bomber-sim = { path = "crates/bomber-sim" }

anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
